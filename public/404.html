<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road not found | Maaz Online</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #0B0F17; --text: #EEF2F8; --muted: #A7B2C3; --accent: #FFD24A; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 30%, #1B2338, var(--bg) 70%); color: var(--text); font-family: system-ui, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .sign { display: inline-block; padding: 10px 22px; border: 4px solid #fff; border-radius: 6px; background: #1E6B3A; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 22px 0 8px; font-size: clamp(28px, 6vw, 44px); }
    p { margin: 0 auto 26px; max-width: 34ch; color: var(--muted); line-height: 1.5; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { padding: 12px 20px; border-radius: 10px; font-weight: 700; text-decoration: none; border: 1px solid #2E3A52; color: var(--text); }
    a.primary { background: var(--accent); color: #14213D; border-color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="sign">404 · DEAD END</div>
    <h1>This road doesn't exist.</h1>
    <p>The page you were looking for isn't in the city. Head back and pick a building.</p>
    <div class="row">
      <a class="primary" href="/#city">Back to the 3D city</a>
      <a href="/#simple">Open the 1-page site</a>
    </div>
  </main>
</body>
</html>
